name: Fixture, GitHub intake and publication
on: [push, pull_request]
jobs:
  fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - run: pnpm install --frozen-lockfile
      - run: cp .env.example .env
      - run: pnpm db:generate
      # A fresh checkout has no restored dist directories. pnpm's dependency
      # graph compiles shared packages before the API and worker consumers.
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: docker compose up -d --wait
      - run: pnpm db:migrate
      - run: pnpm test:integration
      - run: pnpm test:smoke
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down --volumes
